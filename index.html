<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>MyInitiative Gate Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: a control-tower training hall. Top bar with rank/XP, module rail, one working surface.
   Six level colours form a ramp that follows an initiative from idea (L0) to banked money (L5). */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#F5F8FC; --ink:#0F1C2E; --muted:#58687E; --line:#D6DEE9;
  --brand:#14325E; --brand-ink:#FFFFFF; --accent:#F0B429; --accent-ink:#2A1D00;
  --ok:#1B7F55; --ok-bg:#DDF3E8; --bad:#B5373B; --bad-bg:#FAE1E1; --warn-bg:#FFF1CC;
  --l0:#66768C; --l1:#2F6FBE; --l2:#168A96; --l3:#378F57; --l4:#A8650A; --l5:#7448C4;
  --shadow:0 1px 2px rgba(15,28,46,.06),0 6px 20px rgba(15,28,46,.06);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#121D31; --surface2:#182640; --ink:#E8EEF7; --muted:#98A8BF; --line:#263650;
  --brand:#8DB8FF; --brand-ink:#08162B; --accent:#F2B93B; --accent-ink:#2A1D00;
  --ok:#52C98D; --ok-bg:#12382A; --bad:#FF8A8D; --bad-bg:#431B20; --warn-bg:#3A2F10;
  --l0:#7D8DA5; --l1:#4B8BE0; --l2:#2FB0BD; --l3:#4DB071; --l4:#D58A1E; --l5:#9370E0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#121D31; --surface2:#182640; --ink:#E8EEF7; --muted:#98A8BF; --line:#263650;
  --brand:#8DB8FF; --brand-ink:#08162B; --accent:#F2B93B; --accent-ink:#2A1D00;
  --ok:#52C98D; --ok-bg:#12382A; --bad:#FF8A8D; --bad-bg:#431B20; --warn-bg:#3A2F10;
  --l0:#7D8DA5; --l1:#4B8BE0; --l2:#2FB0BD; --l3:#4DB071; --l4:#D58A1E; --l5:#9370E0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.01em}
h3{font-size:21px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1180px;margin-inline:auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.logo i{display:block;height:20px;width:7px;border-radius:2px}
.xpbox{display:flex;align-items:center;gap:10px;min-width:0}
.rank{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--brand);color:var(--brand-ink);white-space:nowrap}
.xpbar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.xpnum{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px}
/* layout */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1180px;margin:22px auto 0}
nav.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:78px;align-self:start}
nav.rail button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
nav.rail button:hover{background:var(--surface)}
nav.rail button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.rail .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none;color:#fff}
nav.rail .dot.on{background:var(--ok);border-color:var(--ok)}
main{min-width:0}
@media(max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.rail{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;gap:6px}
  nav.rail button{white-space:nowrap;background:var(--surface);flex:none;padding:8px 12px}
  .xpbar{width:70px}
}
.view{display:flex;flex-direction:column;gap:22px}
.lede{color:var(--muted);max-width:68ch;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.chip.ap{background:var(--warn-bg);border-color:transparent}
.chip.none{color:var(--muted)}
.lv{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 8px;border-radius:8px;color:#fff;font-family:var(--f-mono);font-weight:600;font-size:13px}
.lv0{background:var(--l0)}.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}.lv4{background:var(--l4)}.lv5{background:var(--l5)}
.sec-title{display:flex;flex-direction:column;gap:6px}
.tag-src{font-size:12px;color:var(--muted)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent) 62%)}
/* funnel */
.funnel{display:flex;flex-direction:column;gap:6px;align-items:center}
.fbar{border:0;color:#fff;padding:11px 14px;text-align:left;display:flex;align-items:center;gap:10px;font-weight:700;border-radius:6px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,14px 100%);transition:transform .2s,filter .2s;min-height:44px}
.fbar:hover,.fbar:focus-visible{transform:scale(1.03);filter:brightness(1.1)}
.fbar span.m{font-family:var(--f-mono);font-size:12px;opacity:.9;margin-left:auto;padding-left:10px;white-space:nowrap}
.fbar{justify-content:center;gap:10px}
.fbar b{font-family:var(--f-mono)}
/* gate track */
.track{display:flex;align-items:stretch;overflow-x:auto;gap:0;padding-bottom:4px}
.tnode{flex:1 0 96px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:6px 4px;position:relative}
.tnode::after{content:"";position:absolute;top:26px;left:50%;width:100%;height:4px;background:var(--line);z-index:0}
.tnode:last-child::after{display:none}
.tnode .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:#fff;border:4px solid var(--bg);z-index:1;transition:transform .2s}
.tnode:hover .c{transform:scale(1.1)}
.tnode.act .c{outline:3px solid var(--accent);outline-offset:2px}
.tnode small{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.tnode.act small{color:var(--ink);font-weight:700}
.tnode.done::after{background:var(--ok)}
/* checklist */
.ck{display:flex;flex-direction:column;gap:8px}
.ck label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.ck input{margin-top:4px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.ck label.on{background:var(--ok-bg);border-color:transparent}
.ck .hint{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.own{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;white-space:nowrap;padding-left:8px}
.group-h{display:flex;gap:10px;align-items:center;margin:14px 0 8px;flex-wrap:wrap}
.group-h .sb{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:6px}
.trap{border-left:4px solid var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:0 10px 10px 0}
.tip{border-left:4px solid var(--accent);background:var(--warn-bg);padding:10px 14px;border-radius:0 10px 10px 0}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
/* matrix */
.mx{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
th button{border:0;background:none;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:700;text-decoration:underline dotted}
td.hl,th.hl{background:var(--warn-bg)}
.cellA,.cellS,.cellC{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-family:var(--f-mono);font-weight:600;font-size:12px}
.cellA{background:var(--brand);color:var(--brand-ink)}
.cellS{background:var(--surface2);border:1px solid var(--line)}
.cellC{border:1px dashed var(--muted);color:var(--muted)}
/* flip cards */
.flip{perspective:900px;border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.flip .in{display:grid;width:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fc,.flip .bc{grid-area:1/1;border-radius:16px;padding:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);box-shadow:var(--shadow);min-height:150px;min-width:0}
.flip .fc{background:var(--surface)}
.flip .bc{background:var(--brand);color:var(--brand-ink);transform:rotateY(180deg);justify-content:center}
.bignum{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
.tcard .bignum{color:var(--brand)}
/* quiz */
.qwrap{display:flex;flex-direction:column;gap:16px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;background:var(--brand);transition:width .3s}
.qtext{font-family:var(--f-display);font-size:clamp(20px,2.6vw,26px);font-weight:700;line-height:1.25}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;font-weight:500;transition:transform .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--brand);transform:translateX(3px)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{padding:14px 16px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.fb.good{background:var(--ok-bg);border-color:transparent}
.fb.bad{background:var(--bad-bg);border-color:transparent}
.ctx{background:var(--surface2);border:1px dashed var(--muted);border-radius:14px;padding:14px 16px}
.hearts{font-size:20px;letter-spacing:3px;color:var(--bad)}
.big-score{font-family:var(--f-display);font-size:68px;font-weight:800;line-height:1;color:var(--brand)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* match */
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
@media(max-width:640px){.match{grid-template-columns:minmax(0,1fr)}}
.mitem{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-size:15px}
.mitem.sel{border-color:var(--accent);background:var(--warn-bg)}
.mitem.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.mcol{display:flex;flex-direction:column;gap:10px}
/* value capture */
.vc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;text-align:center;font-size:13px}
.vc div.col{padding:8px 4px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.vc div.bar{grid-row:2;height:30px;border-radius:99px;background:linear-gradient(90deg,var(--l3),var(--l5));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
/* inputs */
.field{display:flex;flex-direction:column;gap:4px;min-width:130px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.pb{position:relative;height:34px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.pb .fill{position:absolute;inset:0 auto 0 0;background:var(--ok);transition:width .4s}
.pb .mark{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.pb .lab{position:absolute;inset:0;display:flex;align-items:center;padding-inline:14px;font-weight:700;color:#fff;mix-blend-mode:normal}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.badge .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--accent);color:var(--accent-ink)}
.badge.lock{opacity:.5}.badge.lock .ic{background:var(--line);color:var(--muted)}
.badge small{color:var(--muted);font-size:12px;line-height:1.3}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px}
details.acc summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none;display:flex;gap:10px;align-items:center}
details.acc summary::before{content:"+";font-family:var(--f-mono);width:22px;height:22px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;flex:none}
details.acc[open] summary::before{content:"–"}
details.acc .bd{padding:0 0 14px 32px;color:var(--ink)}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;animation:tin .25s,tout .3s 1.6s forwards}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
@media(max-width:600px){
  body{font-size:15.5px}
  .top{padding-block:8px}
  .top-in{gap:8px}
  .brand{font-size:16px;width:100%;margin-right:0}
  .xpbox{flex:1}.xpbar{flex:1;width:auto}
  .card{padding:15px;border-radius:14px}
  .btn{padding:12px 16px;min-height:44px}
  .row>.btn{flex:1 1 auto}
  .opt{padding:13px 14px;min-height:48px}
  .tab{padding:10px 14px;min-height:44px}
  .ck label{padding:12px}
  .ck input{width:22px;height:22px}
  .own{display:none}
  .tnode{flex:1 0 74px}
  .tnode .c{width:38px;height:38px}
  .tnode::after{top:24px}
  .big-score{font-size:52px}
  .fbar{min-height:46px}
  .shell{margin-top:12px}
  nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:15;background:var(--bg);padding-block:6px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
  .toast{left:16px;right:16px;text-align:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sm{font-size:14px;color:var(--muted)}
.sp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
</style>

<canvas id="cf" aria-hidden="true"></canvas>
<header class="top"><div class="top-in">
  <div class="brand"><span class="logo" aria-hidden="true"><i style="background:var(--l1)"></i><i style="background:var(--l3)"></i><i style="background:var(--l5)"></i></span>MyInitiative Gate Academy</div>
  <div class="xpbox"><span class="rank" id="rank">L0 Idea Spark</span><div class="xpbar"><b id="xpb" style="width:0"></b></div><span class="xpnum" id="xpn">0 XP</span></div>
  <button class="ibtn" id="theme" aria-label="Toggle theme">Theme</button>
</div></header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Modules"></nav>
  <main id="main"></main>
</div>

<script>
"use strict";
/* ---------- state ---------- */
var KEY="gate-academy-v1";
var S={xp:0,seen:{},ck:{},best:{},cards:{},badges:{},missed:[],done:{}};
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var RANKS=[[0,"L0 Idea Spark"],[60,"L1 Sizer"],[150,"L2 Business-Case Builder"],[280,"L3 Planner"],[450,"L4 Executor"],[650,"L5 Gatekeeper"]];
function rankInfo(){var r=0;for(var i=0;i<RANKS.length;i++)if(S.xp>=RANKS[i][0])r=i;var nx=RANKS[r+1];return{name:RANKS[r][1],i:r,pct:nx?(S.xp-RANKS[r][0])/(nx[0]-RANKS[r][0])*100:100}}
function paintTop(){var r=rankInfo();document.getElementById("rank").textContent=r.name;document.getElementById("xpb").style.width=r.pct+"%";document.getElementById("xpn").textContent=S.xp+" XP"}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}
function addXP(n,why){var before=rankInfo().i;S.xp+=n;save();paintTop();toast("+"+n+" XP"+(why?" · "+why:""));if(rankInfo().i>before){confetti();toast("Rank up: "+rankInfo().name)}checkBadges()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var RECAP=[
 ["How is the process described in plain terms?","The funnel: an initiative moves through L stages. L0 is an idea from a brainstorm, L1 is putting it in MyInitiative, L2 is the business case with a financial benefit (and perhaps a KPI), L3 is the plan with milestones. L1 to L3 are called bottom-up planning, with no execution yet. Once L3 is approved, implementation starts. L4 means everything is executed, and L5 comes after measuring a stable run-rate that Finance validates. Participants compared it to the company’s project process: “a VPM light”."],
 ["How big does a workstream get?","Over time typically 20 to 40 initiatives, so the people in a workstream have a good overview even if the BU has hundreds."],
 ["Who should be the initiative owner?","Not automatically the person with the idea. The workstream lead and owner assign the right person by capacity and competence, otherwise people with many ideas end up executing all of them. The owner is the one responsible for the end result and for keeping the tool up to date, like a project manager."],
 ["How do teams run it day to day?","Per workstream, invite a few people. Often it is the operations manager of a location with one or two supporters, sometimes a shift leader. Sit together in a weekly or bi-weekly meeting and help people through. The first time is harder than the second. Start one-on-one, then let them train others."],
 ["How do approvals work in the tool?","From L2, approval requests appear for people holding an approval role, and they get an email. For L3 the TO approver gets the message. Approvers are set per workstream and per location. The IT team sets them up through the ServiceNow request, and expert users per BU should later manage this themselves."],
 ["What is confidential access?","Use confidential for initiatives dealing with FTE reductions, salaries or personal data. Rights can be managed per user, with three levels: location, workstream, and confidential or not."],
 ["What end date do I give a recurring benefit?","The horizon of the program, for example the end of 2028, because that is how long benefits are tracked. A one-time benefit only counts in its month or year. The date savings start (the L4 effect) can differ from the end date."],
 ["Do I have to enter everything?","No. About €100, especially one-time, is not relevant. Small obvious fixes can stay on a separate just-do-it list. The point is not to make the tool a roadblock."],
 ["Does the tool decide what counts?","The line at the Netherlands kickoff: as long as it is in the tool it counts, and if it is not in there it does not. It is part of people’s bonus there. Management support at all levels is essential. Confirm how this applies in your BU."],
 ["What is the Netherlands experience?","They started transformation in 2019 and have roughly 3,000 initiatives in the Dutch instance. They did a full-potential scan in March 2025 and had their own initiatives running before that."],
 ["Do spoken definitions differ from the deck?","Slightly. At the kickoff L4 was described as the moment a new contract is live and L5 as measuring for a few months. The deck is more precise: L4 is the bankable step (contract signed and prices loaded), value capture can start at the effective date, and L5 needs two cycles or 6 months, whichever is shorter. Use the deck."],
 ["How are initiatives structured in the tool?","Initiatives move through the stages in MyInitiative from L0 (ideation) to L5 (validated benefit). Benefits are tracked until 2028 to measure total program value."],
 ["Do we need a business case for an obvious initiative?","Keep it proportional. Calculating the saving of ending a 100k contract can be a simple case. More valuable or complex initiatives need more detail."],
 ["What is a workstream and how many should we have?","A functional grouping of initiatives (maintenance, customer service) that follows the management structure and initiative volume. Use the shared templates, request new ones only when strictly necessary, and keep them few."],
 ["Should we create workstreams for departments or head office?","No. Past issues came from separate workstreams for departments and head office. Use location attributes instead. Track organisational remodelling under overhead, or within the maintenance and capital systems workstreams."],
 ["What exactly is an initiative owner?","Similar to a project manager. They execute the initiative and keep MyInitiative updated. They are not just the person who had the idea."],
 ["Can we start entering initiatives while consultants run a full-potential phase?","Starting in parallel is feasible. Setting targets without the full-potential data can be challenging. One team kept a local spreadsheet until the formal planning phase, then migrated into MyInitiative."],
 ["What did the demo show?","A real example executed at a terminal last year: insource cleaning by buying a €6K high-pressure cleaner. It covered title, business unit, site, workstream, primary and backup owner and access level (general to confidential). Then cost saving as type, a rough 30K per year impact, a from-to description, and Oracle-aligned opex lines with an end date at the program horizon (December 2028). Then monthly impacts of 2K, implementation cost of 6K, attachments or linked sheets, L2 and L3 dates, and submission for L2 approval by the finance approver and workstream lead."],
 ["How should we handle double counting with the budget?","Be careful with initiatives already in the budget or already in execution. The L2 test 8 exists for this."],
 ["How do I get access?","Requests go through ServiceNow. The form originally limited organisation choice to the Netherlands and was being updated for US and international users. The Sep 2026 deck links request forms for Singapore, the US and Brazil. The Belgium link is blank in the deck."],
 ["How will training work?","Expert users are trained first and then train their own organisations. The Dutch team can help set up experts but cannot train everyone. Idea: sit one-on-one with initiative owners for their first entries. Engineers adapt fast, operators and shift leaders need step-by-step guidance."],
 ["Who pays for development?","Development so far was funded by the Dutch business unit. A contribution of about 25k per business unit was proposed. There are no fixed fees, only costs for desired developments."],
 ["How is adoption enforced?","Management support at all levels is essential. Tool usage can be tied to bonuses so substantive initiatives are recognised."]
];

function prepQ(q){var idx=q.o.map(function(_,k){return k});if(!q.fixed)idx=shuffle(idx);var c=q.o[q.a];var o=idx.map(function(k){return q.o[k]});return Object.assign({},q,{o:o,a:o.indexOf(c)})}

function runQuiz(root,cfg){
  var qs=cfg.questions.map(prepQ),i=0,score=0,hearts=3,missed=[];
  function end(){
    var pct=Math.round(score/qs.length*100),sim=!!cfg.sim;
    if(cfg.key){S.best[cfg.key]=Math.max(S.best[cfg.key]||0,pct)}
    if(qs.length>=10&&score===qs.length&&!sim){S.best.perfect=(S.best.perfect||0)+1}
    save();
    var msg=pct===100?"Flawless.":pct>=80?"Strong. You know this.":pct>=60?"Solid. Review the misses below.":"Good start. Study the misses and try again.";
    if(pct>=80||sim)confetti();
    root.innerHTML='<div class="card qwrap"><div class="mono">'+esc(cfg.title)+' · complete</div><div class="big-score">'+(sim?'L5':pct+'%')+'</div><h3>'+(sim?"Your initiative reached L5 with "+hearts+" of 3 hearts left.":score+" of "+qs.length+" correct. "+msg)+'</h3>'+
      (missed.length?'<div class="qwrap"><h4>Review these</h4>'+missed.map(function(m){return'<div class="fb bad"><b>'+esc(m.q)+'</b><br>Answer: '+esc(m.o[m.a])+'<br><span class="sm">'+esc(m.w)+'</span></div>'}).join("")+'</div>':"")+
      '<div class="row"><button class="btn" id="again">Play again</button>'+(missed.length&&!sim?'<button class="btn gold" id="retry">Retry the misses</button>':"")+'<button class="btn ghost" id="back">Back</button></div></div>';
    missed.forEach(function(m){if(S.missed.indexOf(m.q)<0)S.missed.push(m.q)});save();
    if(cfg.done)cfg.done({pct:pct,score:score,hearts:hearts});
    checkBadges();
    $("#again",root).onclick=function(){runQuiz(root,Object.assign({},cfg,{questions:cfg.restart?cfg.restart():cfg.questions}))};
    var r=$("#retry",root);if(r)r.onclick=function(){runQuiz(root,Object.assign({},cfg,{key:null,questions:missed.map(function(m){return{q:m.q,o:m.o,a:m.a,w:m.w,fixed:true}})}))};
    $("#back",root).onclick=function(){cfg.back?cfg.back():go("quiz")};
  }
  function show(){
    var q=qs[i],answered=false;

      '<div class="prog"><b style="width:'+(i/qs.length*100)+'%"></b></div>'+

      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div class="opts">'+q.o.map(function(o,k){return'<button class="opt" data-k="'+k+'"><span class="k">'+String.fromCharCode(65+k)+'</span><span>'+esc(o)+'</span></button>'}).join("")+'</div>'+
      '<div id="fbk"></div></div>';
    $$(".opt",root).forEach(function(b){b.onclick=function(){
      if(answered)return;answered=true;var k=+b.dataset.k,ok=k===q.a;
      $$(".opt",root).forEach(function(x){x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("right")});

      $("#fbk",root).innerHTML='<div class="fb '+(ok?"good":"bad")+'"><b>'+(ok?"Correct. ":"Not quite. ")+'</b>'+esc(q.w)+'</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">'+(i+1<qs.length?"Next":"Finish")+'</button></div>';
      var nx=$("#nx",root);nx.focus();nx.onclick=function(){i++;i<qs.length?show():end()};
    }});
  }
  show();

/* ---- flashcards ---- */
function cardsMod(v){
  var deck=QB.map(function(x,i){return{id:"q"+i,f:x[1],b:x[2][x[3]]+" — "+x[4],tags:x[0]}}).concat(TESTS.map(function(t,i){return{id:"t"+i,f:"Test "+(i+1)+" of the 10 tests: what does “"+t[0]+"” ask?",b:t[1],tags:["l2"]}}));
  var filter="all",idx=0,flipped=false,q=[];
  v.innerHTML=head("Flashcards","Flip, then say whether you knew it. Cards you miss come back first. Mark 30 as known for the Card Shark badge.")+'<div class="tabs" id="ft"></div><div id="fc" class="qwrap"></div>';
  var tabs=[["all","All"],["l1","L1"],["l2","L2"],["l3","L3"],["l4","L4"],["l5","L5"],["roles","Roles"],["meeting","Meeting"],["num","Numbers"]];
  function build(){q=deck.filter(function(c){return filter==="all"||c.tags.indexOf(filter)>=0});q=shuffle(q).sort(function(a,b){return(S.cards[a.id]?1:0)-(S.cards[b.id]?1:0)});idx=0;flipped=false;draw()}
  function draw(){
    $("#ft",v).innerHTML=tabs.map(function(t){return'<button class="tab" aria-pressed="'+(t[0]===filter)+'" data-f="'+t[0]+'">'+t[1]+'</button>'}).join("");
    $$("#ft .tab",v).forEach(function(b){b.onclick=function(){filter=b.dataset.f;build()}});
    var known=q.filter(function(c){return S.cards[c.id]}).length;
    if(!q.length){$("#fc",v).innerHTML='<div class="card">No cards in this filter.</div>';return}
    if(idx>=q.length){$("#fc",v).innerHTML='<div class="card qwrap"><h3>Deck finished</h3><p>'+known+' of '+q.length+' known.</p><div class="row"><button class="btn" id="rs">Restart</button></div></div>';$("#rs",v).onclick=build;return}
    var c=q[idx];
    $("#fc",v).innerHTML='<div class="sp"><span class="mono">Card '+(idx+1)+' of '+q.length+'</span><span class="mono">'+known+' known</span></div><div class="prog"><b style="width:'+(idx/q.length*100)+'%"></b></div><button class="card" id="cd" style="min-height:220px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:12px"><span class="mono">'+(flipped?"Answer":"Question · tap to flip")+'</span><span class="qtext">'+esc(flipped?c.b:c.f)+'</span></button><div class="row"><button class="btn ghost" id="ag" '+(flipped?"":"disabled")+'>Again</button><button class="btn" id="gt" '+(flipped?"":"disabled")+'>Got it</button></div>';
    $("#cd",v).onclick=function(){flipped=!flipped;draw()};
    $("#ag",v).onclick=function(){S.cards[c.id]=false;save();idx++;flipped=false;draw()};
    $("#gt",v).onclick=function(){if(!S.cards[c.id])addXP(2);S.cards[c.id]=true;save();checkBadges();idx++;flipped=false;draw()};
  }
  build();
}
